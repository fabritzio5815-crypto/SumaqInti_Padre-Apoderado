<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sumaq Inti · Portal del apoderado</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#4a2c6b;--pd:#3a2054;--pl:#e9dff3;--cr:#f6f0e1;--y:#f6c85f;--g:#8fd3c0;--tx:#2d1b45;--m:#74658a;--r:#c0392b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Nunito,system-ui,sans-serif;background:var(--cr);color:var(--tx)}
button,input,select,textarea{font-family:inherit}
a{color:var(--p);font-weight:700}
h1{font-size:26px;font-weight:800;color:var(--p)}h2{font-size:18px;font-weight:800}h3{font-size:15px;font-weight:800}
.m{color:var(--m)}.s{font-size:13px}
.btn{border:2px solid var(--p);background:var(--p);color:#fff;font-weight:700;font-size:15px;padding:13px 20px;border-radius:99px;cursor:pointer;transition:.2s}
.btn:hover{background:var(--pd)}.btn.o{background:#fff;color:var(--p)}.btn.o:hover{background:var(--pl)}.btn.w{width:100%}.btn.y{background:var(--y);border-color:var(--y);color:var(--tx)}
.card{background:#fff;border:2px solid var(--p);border-radius:18px;padding:18px}
.logo{display:flex;align-items:center;gap:8px;color:#fff;font-weight:800;line-height:1}
.logo img{width:46px;height:40px;object-fit:contain;background:#fbf5ee;border-radius:10px}.logo b{font-size:19px;letter-spacing:.5px;display:block}.logo small{color:var(--y);letter-spacing:3px;font-size:12px;font-weight:800}
/* login */
.lg{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh}
.lft{background:var(--p);color:#fff;padding:36px 44px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
.lft .logo{position:absolute;left:36px;top:30px}
.lft .big{width:180px;margin-bottom:30px}.lft h2{font-size:28px;margin-bottom:14px}.lft p{opacity:.9;max-width:380px;line-height:1.55}
.lft a.pt{position:absolute;left:44px;bottom:30px;color:#fff;font-weight:600;opacity:.85}
.rgt{display:flex;align-items:center;justify-content:center;padding:30px}
.fi{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px;text-align:center}.fi h2{font-size:30px;color:var(--p)}
.iw{position:relative}.iw span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.85}
.iw input{width:100%;padding:15px 16px 15px 46px;border:2px solid var(--p);border-radius:16px;font-size:15px;background:#fff;outline:none;color:var(--tx)}.iw input:focus{box-shadow:0 0 0 4px var(--pl)}
.fl{text-align:right;font-size:13px}.er{color:var(--r);font-size:13px;min-height:16px;font-weight:600}
.dm{background:#fff;border:2px dashed #cdbfe0;border-radius:14px;padding:10px 12px;font-size:12px;color:var(--m);text-align:left}.dm button{border:0;background:none;color:var(--p);font-weight:800;text-decoration:underline;cursor:pointer;font-size:12px}
/* app */
.app{display:flex;min-height:100vh}
.side{width:230px;background:var(--p);padding:22px 14px;display:flex;flex-direction:column;gap:6px;flex-shrink:0;position:sticky;top:0;height:100vh}
.side .logo{margin-bottom:26px;padding-left:6px}
.side button.n{border:0;background:none;color:#fff;text-align:left;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}
.side button.n:hover{background:rgba(255,255,255,.12)}.side button.n.on{background:var(--cr);color:var(--p);font-weight:800}
.usr{margin-top:auto;border-top:1px solid rgba(255,255,255,.25);padding-top:14px;display:flex;gap:10px;align-items:center;color:#fff;font-size:13px}.usr small{display:block;opacity:.75}
.av{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--p);display:grid;place-items:center;font-weight:800;flex-shrink:0}
.main{flex:1;padding:24px 28px;max-width:1180px;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.sel{padding:10px 16px;border:2px solid var(--p);border-radius:99px;background:#fff;font-size:14px;font-weight:600;color:var(--tx);cursor:pointer}
.g{display:grid;gap:16px}.g2{grid-template-columns:1.9fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;margin-top:12px}
.rings h3{font-size:14px;line-height:1.2;min-height:34px;color:var(--tx)}
.ring{position:relative;width:104px;height:104px;margin:6px auto 0}.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:11}
.ring .bg{stroke:var(--cr)}.ring .fg{stroke:var(--p);stroke-linecap:round;transition:stroke-dashoffset 1s}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font-size:21px;line-height:1.1}.ring small{font-size:11px;display:block}
.al{border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px;line-height:1.45}.al b{display:block}.al.w{background:#fff1c6}.al.k{background:#d9f0e4}.al.i{background:var(--pl)}
.cht{position:relative}.cht svg{width:100%;height:auto;display:block}.lgd{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin:8px 0}.lgd i{display:inline-block;width:22px;height:4px;border-radius:9px;vertical-align:middle;margin-right:6px}
.tip{position:absolute;background:var(--tx);color:#fff;font-size:12px;padding:8px 10px;border-radius:10px;pointer-events:none;display:none;white-space:nowrap;z-index:3}
.seg{display:inline-flex;background:var(--pl);border-radius:99px;padding:3px}.seg button{border:0;background:none;padding:6px 14px;border-radius:99px;font-weight:700;font-size:12px;cursor:pointer;color:var(--m)}.seg button.on{background:var(--p);color:#fff}
.stp{display:flex;justify-content:space-between;position:relative;margin-top:10px}.stp:before{content:"";position:absolute;top:24px;left:9%;right:9%;height:4px;background:var(--pl)}
.stp div{flex:1;text-align:center;font-size:12px;font-weight:700;position:relative}.stp small{display:block;color:var(--m);font-weight:600}
.stp i{width:48px;height:48px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-style:normal;font-size:20px;background:var(--pl);color:#a190b8}
.stp .dn i{background:var(--p);color:#fff}.stp .ac i{background:var(--y);color:var(--tx);box-shadow:0 0 0 6px #fbe9b9}
.bd{text-align:center;padding:16px 10px}.bd b{font-size:38px;display:block}.bd.lk{opacity:.4;filter:grayscale(1)}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #f0eaf6;font-size:14px}.row:last-child{border:0}
.bar{height:10px;background:var(--pl);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p);border-radius:99px}
.kid{display:flex;gap:14px;align-items:center;cursor:pointer;transition:.2s}.kid:hover{background:#fbf8ff}.kid .av{width:54px;height:54px;background:var(--pl);font-size:18px}
.chip{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--pl);color:var(--p)}.chip.y{background:#ffe9a8;color:#8a5a00}.chip.gr{background:#d6f0e3;color:#1e7a50}
/* reporte */
.rp{display:grid;grid-template-columns:1.6fr 1fr;gap:0}.rp>div{padding:6px 22px}.rp>div:first-child{padding-left:4px;border-right:1px solid #e5ddf1}
.nl{display:flex;gap:18px;align-items:center;margin:8px 0 18px}
.lv{width:78px;height:78px;border-radius:50%;border:5px solid var(--p);display:grid;place-items:center;font-size:40px;font-weight:800;flex-shrink:0}
.sc{position:relative;height:18px;border-radius:99px;overflow:hidden;display:flex;margin-top:22px}.sc div{flex:1}.sc .mk{position:absolute;top:-22px;transform:translateX(-50%);background:var(--p);color:#fff;border-radius:99px;width:22px;height:22px;display:grid;place-items:center;font-size:11px;font-weight:800;transition:left .8s}
.scl{display:flex;justify-content:space-between;font-size:12px;margin-top:4px}
.tp{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:14px;line-height:1.4}.tp b{background:var(--y);width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;font-size:16px}
.acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}.acts .btn{min-width:240px}
.ft{border-top:1px solid #e5ddf1;padding-top:14px;text-align:center;font-size:13px;color:var(--tx)}
/* config */
.fm label{display:block;font-size:13px;font-weight:700;margin:14px 0 4px}.fm input,.fm textarea{width:100%;padding:11px 14px;border:2px solid #d9cfe6;border-radius:12px;font-size:14px;background:#fff;outline:none;color:var(--tx)}.fm input:focus,.fm textarea:focus{border-color:var(--p)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f0eaf6;font-size:14px;gap:10px}.sw input{width:20px;height:20px;accent-color:var(--p)}
.mod{position:fixed;inset:0;background:rgba(45,27,69,.55);display:none;place-items:center;z-index:20;padding:16px}.mod.on{display:grid}.mod .card{width:100%;max-width:460px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:12px 20px;border-radius:99px;font-weight:700;font-size:14px;z-index:30;display:none;max-width:92vw;text-align:center}
@media(max-width:1000px){.g2,.rp{grid-template-columns:1fr}.rp>div{padding:6px 0}.rp>div:first-child{border-right:0;border-bottom:1px solid #e5ddf1;padding-bottom:16px}.g4{grid-template-columns:1fr 1fr}.rings{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.lg{grid-template-columns:1fr}.lft{display:none}.app{flex-direction:column}.side{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px}.side .logo,.usr{display:none}.side button.n{white-space:nowrap}.main{padding:16px}.g3,.g4{grid-template-columns:1fr}.stp{overflow-x:auto;gap:8px}.stp div{min-width:80px}.stp:before{display:none}.acts .btn{min-width:0;width:100%}}
@media print{.side,.noprint,.toast,.mod,.hd .sel{display:none!important}.main{padding:0}body{background:#fff}}
</style>
</head>
<body>
<div id="app"></div>
<div class="mod" id="mod"><div class="card fm" id="modc"></div></div>
<div class="toast" id="toast"></div>

/* datos locales */
const U=()=>{try{return JSON.parse(localStorage.getItem('sa_u')||'{}')}catch(e){return {}}};
const SU=u=>{try{localStorage.setItem('sa_u',JSON.stringify(u))}catch(e){}};
const ses=()=>{try{return localStorage.getItem('sa_s')||sessionStorage.getItem('sa_s')}catch(e){return null}};
let me=null,v='land',kid=0,wk=0,bim='II',shown=false;
const cur=()=>U()[me];
const save=fn=>{const u=U();fn(u[me]);SU(u)};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2600)}
const go=x=>{v=x;shown=false;render();scrollTo(0,0)};

const apellido=n=>n.split(' ').slice(-1)[0];

/* acceso */
function doLog(){const e=$('#e').value.trim().toLowerCase(),p=$('#p').value,c=$('#c').value.trim().toUpperCase(),er=$('#er');
 if(!e.includes('@')||!e.includes('.'))return er.textContent='Escribe un correo válido.';
 if(p.length<6)return er.textContent='La contraseña debe tener al menos 6 caracteres.';
 if(!CODES.includes(c))return er.textContent='Código del colegio no válido. Pídelo en la secretaría.';
 const u=U();
 if(u[e]){if(u[e].p!==p)return er.textContent='Correo o contraseña incorrectos.'}
 else{const loc=e.split('@')[0].split(/[._-]/).pop();const nm=e=='apoderado@demo.pe'?'Sr. Sánchez':'Sr./Sra. '+loc.charAt(0).toUpperCase()+loc.slice(1);u[e]={n:nm,e,p,c,msgs:[],env:[],pref:{av:true,ma:true,sem:false}};SU(u)}
 try{localStorage.setItem('sa_s',e)}catch(x){sessionStorage.setItem('sa_s',e)}
 v='inicio';kid=0;render()}
function demo(){$('#e').value='apoderado@demo.pe';$('#p').value='123456';$('#c').value='SUMAQ2026'}
function out(){try{localStorage.removeItem('sa_s');sessionStorage.removeItem('sa_s')}catch(e){}v='land';render()}

const AUTH=()=>{const ia=(i,id,ph,t)=>`<div class="iw"><span>${i}</span><input id="${id}" type="${t||'text'}" placeholder="${ph}" aria-label="${ph}" maxlength="60" autocomplete="off"></div>`;
 return `<div class="lg"><div class="lft"><div class="logo"><img src="${LOGO_SM}" alt=""><div><b>SUMAQ</b><small>INTI</small></div></div><img class="big" src="${LOGO_BIG}" alt="Sumaq Inti"><h2>Tu futuro también se planifica</h2><p>Plataforma de educación financiera gamificada para estudiantes, con evidencia de avance para el hogar.</p><a class="pt" href="index.html">Portal del estudiante</a></div>
<div class="rgt"><div class="fi" onkeydown="if(event.key=='Enter')doLog()"><h2>¡Bienvenido, apoderado!</h2><p style="margin-bottom:6px">Ingresa para acompañar el progreso financiero de tu hijo.</p>
${ia('✉️','e','Correo electrónico','email')}${ia('🔒','p','Contraseña','password')}${ia('🔑','c','Código del colegio')}
<div class="fl"><a href="#" onclick="toast('Te enviaremos un enlace al correo registrado (demo).');return false">¿Olvidaste tu contraseña?</a></div><p id="er" class="er" role="alert"></p>
<button class="btn w" style="padding:16px;font-size:16px" onclick="doLog()">Vincular con mi hijo</button>
<p class="m s">Los datos de tu hijo están protegidos y solo tú y el colegio pueden ver su progreso.</p>
<div class="dm">Demo: <b>apoderado@demo.pe</b> · <b>123456</b> · código <b>SUMAQ2026</b> <button onclick="demo()">Usar datos demo</button><br>Un correo nuevo crea tu cuenta al vincular.</div></div></div></div>`};

/* componentes */
function ring(val,max,txt,sub){const r=45,c=2*Math.PI*r,off=c*(1-Math.min(1,val/max));
 return `<div class="ring"><svg width="104" height="104" viewBox="0 0 104 104"><circle class="bg" cx="52" cy="52" r="${r}"/><circle class="fg" cx="52" cy="52" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${shown?off:c}" data-off="${off}"/></svg><div><span>${txt}${sub?`<small>${sub}</small>`:''}</span></div></div>`}
function line(){const d=K().sem[wk],S=[['Tiempo de uso (horas)',d.u,'#4a2c6b'],['Avance Módulo Ahorro',d.a,'#f6c85f'],['Avance Módulo Presupuesto',d.p,'#8fd3c0']];
 const W=640,H=300,L=34,R=12,T=14,B=28,mx=14,x=i=>L+i*(W-L-R)/6,y=n=>T+(1-n/mx)*(H-T-B);
 let s=`<svg viewBox="0 0 ${W} ${H}" id="lc" role="img" aria-label="Gráfico de evolución semanal">`;
 for(let t=0;t<=mx;t+=2)s+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="#eee8f5"/><text x="${L-8}" y="${y(t)+4}" font-size="11" text-anchor="end" fill="#74658a">${t}</text>`;
 DIAS.forEach((n,i)=>s+=`<text x="${x(i)}" y="${H-8}" font-size="11" text-anchor="middle" fill="#74658a">${n==='Dom'&&wk==0?'Dom':n}</text>`);
 S.forEach(a=>{s+=`<polyline fill="none" stroke="${a[2]}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" points="${a[1].map((n,i)=>x(i)+','+y(n)).join(' ')}"/>`;a[1].forEach((n,i)=>s+=`<circle cx="${x(i)}" cy="${y(n)}" r="3.5" fill="${a[2]}"/>`)});
 DIAS.forEach((n,i)=>s+=`<rect x="${x(i)-26}" y="${T}" width="52" height="${H-T-B}" fill="transparent" onmousemove="tip(event,${i})" onmouseleave="$('#tp').style.display='none'" ontouchstart="tip(event.touches[0],${i})"/>`);
 return `<div class="lgd">${S.map(a=>`<span><i style="background:${a[2]}"></i>${a[0]}</span>`).join('')}</div><div class="cht">${s}</svg><div class="tip" id="tp"></div></div>`}
function tip(e,i){const d=K().sem[wk],t=$('#tp'),box=$('.cht').getBoundingClientRect();
 t.innerHTML=`<b>${DIAS[i]}</b><br>Tiempo: ${d.u[i]} h<br>Ahorro: ${d.a[i]}<br>Presupuesto: ${d.p[i]}`;t.style.display='block';
 t.style.left=Math.min(box.width-130,Math.max(0,e.clientX-box.left+12))+'px';t.style.top='20px'}
function radar(m,size=230){const n=5,cx=size/2,cy=size/2+4,R=size/2-48,pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*r,cy+Math.sin(a)*R*r]};
 let s=`<svg viewBox="0 0 ${size} ${size+10}" style="max-width:${size+40}px;width:100%" role="img" aria-label="Gráfico de avance por módulo">`;
 [.25,.5,.75,1].forEach(r=>s+=`<polygon points="${[...Array(n)].map((_,i)=>pt(i,r).join(',')).join(' ')}" fill="none" stroke="#e5ddf1"/>`);
 for(let i=0;i<n;i++){const[a,b]=pt(i,1);s+=`<line x1="${cx}" y1="${cy}" x2="${a}" y2="${b}" stroke="#e5ddf1"/>`;const[tx,ty]=pt(i,1.28);s+=`<text x="${tx}" y="${ty+3}" font-size="10" text-anchor="middle" fill="#2d1b45">${MN[i].split(' ')[0]}</text>`}
 s+=`<polygon points="${m.map((v,i)=>pt(i,v/100).join(',')).join(' ')}" fill="rgba(143,211,192,.65)" stroke="#4a2c6b" stroke-width="2.5"/>`;m.forEach((v,i)=>{const[a,b]=pt(i,v/100);s+=`<circle cx="${a}" cy="${b}" r="3.5" fill="#4a2c6b"><title>${MN[i]}: ${v}%</title></circle>`});return s+'</svg>'}
const kidSel=()=>`<select class="sel noprint" aria-label="Seleccionar hijo/a" onchange="kid=+this.value;shown=false;render()">${KIDS.map((k,i)=>`<option value="${i}" ${i==kid?'selected':''}>Seleccionar hijo/a: ${k.n}</option>`).join('')}</select>`;
function alerts(k){const x=cur(),a=[];
 a.push(k.ult>=3?`<div class="al w"><b>⚠️ Cuidado</b>Tu hijo no ha ingresado en ${k.ult} días.</div>`:`<div class="al i"><b>👍 Al día</b>${k.n.split(' ')[0]} ingresó ${k.ult==0?'hoy':'hace '+k.ult+' día(s)'}.</div>`);
 a.push(`<div class="al k"><b>🎉 Felicitaciones</b>${k.fel}</div>`);
 const wm=MN[k.m.indexOf(Math.min(...k.m))];a.push(`<div class="al i"><b>💡 Para reforzar</b>El módulo con menor avance es «${wm}».</div>`);return a.join('')}

/* vistas */
function inicio(){const x=cur();
 return `<div class="hd"><h1>¡Hola, ${esc(x.n)}! 👋</h1></div><p class="m" style="margin:-8px 0 18px">Este es el resumen del progreso financiero de tus hijos.</p>
<div class="g g2" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">${KIDS.map((k,i)=>`<div class="card kid" onclick="kid=${i};go('progreso')"><div class="av">${k.n.split(' ').map(w=>w[0]).join('')}</div><div style="flex:1"><h2>${k.n}</h2><p class="m s">${k.g} · Nivel ${k.lvl}: ${LV[k.lvl-1]}</p><div class="bar" style="margin:8px 0 4px"><i style="width:${k.av}%"></i></div><p class="s"><b>${k.av}%</b> del curso · Racha ${k.racha} días</p></div>${k.ult>=3?'<span class="chip y">⚠️ '+k.ult+' días sin ingresar</span>':'<span class="chip gr">Al día</span>'}</div>`).join('')}</div>
<h3 style="margin:22px 0 10px">Accesos rápidos</h3><div class="g g3">${[['progreso','📈','Ver progreso'],['hitos','🏆','Hitos y recompensas'],['reporte','📄','Reporte del bimestre']].map(a=>`<div class="card kid" onclick="go('${a[0]}')"><span style="font-size:30px">${a[1]}</span><h3>${a[2]}</h3></div>`).join('')}</div>
${x.env.length?`<h3 style="margin:22px 0 10px">Mensajes de ánimo enviados</h3><div class="card">${x.env.slice(0,4).map(m=>`<div class="row"><span>💌 <b>${esc(m[0])}:</b> ${esc(m[1])}</span><span class="m s">${m[2]}</span></div>`).join('')}</div>`:''}`}

function progreso(){const k=K(),x=cur();
 return `<div class="hd"><h1>Panel Principal</h1>${kidSel()}</div>
<div class="g g2"><div style="display:flex;flex-direction:column;gap:16px"><div class="card"><h2 style="text-align:center">${k.n} - Nivel ${k.lvl}: ${['','Aventurero','Explorador Financiero','Inversor','Experto'][k.lvl-1]||LV[k.lvl-1]}</h2>
<div class="rings"><div><h3>Avance del Curso</h3>${ring(k.av,100,k.av+'%','completado')}</div><div><h3>Retos Completados</h3>${ring(k.rt,k.rtT,k.rt+' <small style="display:inline">de '+k.rtT+'</small>')}</div><div><h3>Insignias Obtenidas</h3>${ring(k.ins,8,k.ins)}</div><div><h3>Racha de Días Activos</h3>${ring(k.racha,30,k.racha+' días')}</div></div></div>
<div class="card"><div class="hd" style="margin:0"><h2>Gráfico de Evolución Semanal</h2><div class="seg noprint"><button class="${wk==0?'on':''}" onclick="wk=0;shown=true;render()">Esta semana</button><button class="${wk==1?'on':''}" onclick="wk=1;shown=true;render()">Semana anterior</button></div></div>${line()}</div></div>
<div class="card" style="align-self:start"><h2 style="margin-bottom:12px">Alertas para el Apoderado</h2>${alerts(k)}<div id="det" style="display:none"><div class="al i"><b>Detalle de actividad</b>${k.log.map(l=>`${l[0]} (${l[1]}) · ${l[2]}`).join('<br>')}</div></div>
<button class="btn w" onclick="msg()">Enviar mensaje de ánimo</button><div style="height:10px"></div><button class="btn o w" onclick="const d=$('#det');d.style.display=d.style.display=='none'?'block':'none'">Ver detalles</button>
${x.env.filter(m=>m[0]==k.n.split(' ')[0]).length?`<p class="m s" style="margin-top:12px">Último mensaje enviado: «${esc(x.env.find(m=>m[0]==k.n.split(' ')[0])[1])}»</p>`:''}</div></div>`}

function modal(h){$('#modc').innerHTML=h;$('#mod').classList.add('on')}
const closeM=()=>$('#mod').classList.remove('on');
function msg(){const k=K(),n=k.n.split(' ')[0];modal(`<h2>Mensaje de ánimo para ${n}</h2><p class="m s" style="margin-top:4px">${n} lo verá en su portal del estudiante.</p><label for="mt">Tu mensaje</label><textarea id="mt" rows="3" maxlength="140">¡Vamos ${n}, estoy orgulloso/a de tu esfuerzo! 💪</textarea><div style="display:flex;gap:10px;margin-top:16px"><button class="btn w" onclick="sendM()">Enviar</button><button class="btn o w" onclick="closeM()">Cancelar</button></div>`)}
function sendM(){const t=$('#mt').value.trim();if(!t)return toast('Escribe un mensaje');const n=K().n.split(' ')[0];save(x=>x.env.unshift([n,t,new Date().toLocaleDateString('es-PE')]));closeM();toast('Mensaje de ánimo enviado a '+n);render()}

function hitos(){const k=K(),l=k.lvl-1,pts=[0,100,200,300,400];
 return `<div class="hd"><h1>Hitos y Recompensas</h1>${kidSel()}</div>
<div class="card"><h2>Camino de niveles de ${k.n.split(' ')[0]}</h2><div class="stp">${LV.map((n,i)=>`<div class="${i<l?'dn':i==l?'ac':''}"><i>${i<l?'✓':i==l?'★':'🔒'}</i>Nivel ${i+1}<small>${n}</small></div>`).join('')}</div></div>
<h3 style="margin:20px 0 10px">Insignias (${k.bad.filter(b=>b[2]).length} de ${k.bad.length})</h3><div class="g g4">${k.bad.map(b=>`<div class="card bd ${b[2]?'':'lk'}"><b>${b[0]}</b><h3>${b[1]}</h3><p class="m s">${b[2]?'Obtenida':'Por desbloquear'}</p></div>`).join('')}</div>
<div class="g g2" style="grid-template-columns:1fr 1fr;margin-top:20px"><div class="card"><h2 style="margin-bottom:8px">Logros recientes</h2>${k.log.map(a=>`<div class="row"><span>🎖️ ${a[0]}</span><span><b style="color:var(--p)">${a[1]}</b> <span class="m s">${a[2]}</span></span></div>`).join('')}</div>
<div class="card"><h2 style="margin-bottom:8px">Premia en casa 🎁</h2><p class="s m" style="margin-bottom:8px">Ideas para celebrar sus logros sin gastar de más:</p>${['Elegir la película del fin de semana','Una salida al parque o un picnic familiar','Sumar S/ 5 a su alcancía de meta','Reconocerlo en la cena familiar'].map(t=>`<div class="row"><span>⭐ ${t}</span></div>`).join('')}</div></div>`}

function reporte(){const k=K(),x=cur(),[lt,ld]=nivel(k.av),ix=['C','B','A','AD'].indexOf(lt),pos=[12.5,37.5,62.5,87.5][ix],wi=k.m.indexOf(Math.min(...k.m)),ult=x.env;const comp=(x.comp||{})[k.id+bim];
 return `<div class="hd"><h1>Reporte de Logros y Recomendaciones</h1>${kidSel()}</div>
<div class="card"><div class="hd" style="margin-bottom:8px"><h2 style="font-size:22px;color:var(--p)">Reporte de Logros - ${bim} Bimestre</h2><select class="sel noprint" aria-label="Bimestre" onchange="bim=this.value;render()">${['I','II','III','IV'].map(b=>`<option ${b==bim?'selected':''} value="${b}">${b} Bimestre</option>`).join('')}</select></div>
<div class="rp"><div><p class="m">Competencia del Currículo Nacional</p><h2 style="font-size:20px;margin-bottom:12px">Gestiona responsablemente los recursos económicos</h2><p class="m" style="margin-bottom:6px">Nivel de Logro</p>
<div class="nl"><div class="lv">${lt}</div><div style="flex:1"><h3 style="font-size:17px">${ld}</h3><div class="sc"><div style="background:#e9a7c4"></div><div style="background:var(--p)"></div><div style="background:var(--y)"></div><div style="background:var(--g)"></div><span class="mk" style="left:${shown?pos:0}%">${lt}</span></div><div class="scl"><span>C</span><span>B</span><span>A</span><span>AD</span></div></div></div>
<h3>Gráfico de Avance</h3><div style="display:flex;justify-content:center">${radar(k.m)}</div></div>
<div><h2 style="margin-bottom:6px">Recomendaciones para Casa</h2>
<div class="tp"><b>＋</b><span><b style="all:unset;font-weight:800">Tip 1</b><br>Pídele que te explique cómo usa Yape (u otra billetera digital).</span></div>
<div class="tp"><b>＋</b><span><b style="all:unset;font-weight:800">Tip 2</b><br>Anímalo a ahorrar para una meta 🐷</span></div>
<div class="tp"><b>＋</b><span><b style="all:unset;font-weight:800">Tip 3</b><br>Revisen juntos el presupuesto familiar.</span></div>
<div class="tp"><b>＋</b><span><b style="all:unset;font-weight:800">Tip 4</b><br>Refuercen «${MN[wi]}»: está en ${k.m[wi]}% de avance.</span></div></div></div></div>
<div class="acts noprint"><button class="btn" onclick="print()">Descargar informe en PDF</button><button class="btn o" onclick="share()">Compartir con el colegio</button></div>
${comp?`<p class="s" style="text-align:center;margin-bottom:10px">✓ Compartido con el colegio el ${comp}</p>`:''}
<p class="ft">Este reporte es generado automáticamente por SUMAQ INTI y validado por el docente</p>`}
function share(){const k=K();modal(`<h2>Compartir con el colegio</h2><p class="m s" style="margin-top:4px">Se enviará el reporte de ${k.n} (${bim} Bimestre) al tutor de ${k.g}.</p><label for="mt">Comentario opcional</label><textarea id="mt" rows="3" maxlength="200" placeholder="Ej. Quisiera conversar sobre el avance en Crédito."></textarea><div style="display:flex;gap:10px;margin-top:16px"><button class="btn w" onclick="doShare()">Enviar</button><button class="btn o w" onclick="closeM()">Cancelar</button></div>`)}
function doShare(){const k=K(),d=new Date().toLocaleDateString('es-PE');save(x=>{x.comp=x.comp||{};x.comp[k.id+bim]=d});closeM();toast('Reporte compartido con el colegio');shown=true;render()}

function conf(){const x=cur();
 return `<div class="hd"><h1>Configuración de Cuenta</h1></div><div class="g" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card fm"><h2>Mis datos</h2><label for="cn">Nombre</label><input id="cn" value="${esc(x.n)}"><label for="ce">Correo</label><input id="ce" value="${esc(x.e)}" readonly><label for="cc">Código del colegio</label><input id="cc" value="${esc(x.c)}" readonly><div style="height:16px"></div><button class="btn w" onclick="svc()">Guardar cambios</button><div style="height:10px"></div><button class="btn o w" onclick="out()">Cerrar sesión</button></div>
<div style="display:flex;flex-direction:column;gap:16px"><div class="card"><h2>Notificaciones</h2>${[['av','Avisarme si mi hijo no ingresa en 3 días'],['ma','Avisarme cuando obtenga una insignia'],['sem','Resumen semanal por correo']].map(p=>`<label class="sw"><span>${p[1]}</span><input type="checkbox" ${x.pref[p[0]]?'checked':''} onchange="pref('${p[0]}',this.checked)"></label>`).join('')}</div>

function svc(){const n=$('#cn').value.trim();if(!n)return toast('Escribe tu nombre');save(x=>x.n=n);toast('Cambios guardados');render()}
function pref(k,b){save(x=>x.pref[k]=b);toast('Preferencia guardada')}

const VIEWS={inicio,progreso,hitos,reporte,conf};
function render(){me=ses();if(me&&!U()[me])me=null;const a=$('#app');
 if(!me){a.innerHTML=AUTH();return}
 if(!VIEWS[v])v='inicio';const x=cur();
 a.innerHTML=`<div class="app"><nav class="side" aria-label="Menú"><div class="logo"><img src="${LOGO_SM}" alt=""><div><b>SUMAQ</b><small>INTI</small></div></div>${NAV.map(n=>`<button class="n ${v==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}<div class="usr"><div class="av">${esc(x.n.replace(/^Sr\.(\/Sra\.)?\s*/,'').charAt(0).toUpperCase())}</div><div>Hola, ${esc(x.n)}<small>Apoderado</small></div></div></nav><div class="main">${VIEWS[v]()}</div></div>`;
 if(!shown){requestAnimationFrame(()=>requestAnimationFrame(()=>{shown=true;document.querySelectorAll('.ring .fg').forEach(c=>c.style.strokeDashoffset=c.dataset.off);const m=$('.sc .mk');if(m){const k=K(),i=['C','B','A','AD'].indexOf(nivel(k.av)[0]);m.style.left=[12.5,37.5,62.5,87.5][i]+'%'}}))}}
render();
</script>
